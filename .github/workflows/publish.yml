name: Publish to PyPI (on N-N-N commit message)

# Triggers on push to main/master. The package is only built and published
# when the latest commit message STARTS WITH a version like "1-2-3", which
# becomes version 1.2.3. Any other commit message is ignored (no publish).

on:
  push:
    branches:
      - main
      - master

jobs:
  # ---------------------------------------------------------------
  # 1) Decide whether to publish, and parse the version from the
  #    commit message (e.g. "1-4-0 add image detection" -> 1.4.0)
  # ---------------------------------------------------------------
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.check.outputs.run_ci }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check commit message pattern
        id: check
        run: |
          msg="${{ github.event.head_commit.message }}"
          echo "Last commit message: $msg"

          if [[ "$msg" =~ ^([0-9]+)-([0-9]+)-([0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Commit matches pattern. Version will be: $VERSION"
          else
            echo "run_ci=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Commit does NOT match N-N-N pattern, skipping publish."
          fi

  # ---------------------------------------------------------------
  # 2) Run the test suite (only if we're going to publish)
  # ---------------------------------------------------------------
  test:
    needs: check-commit
    if: needs.check-commit.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package with dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  # ---------------------------------------------------------------
  # 3) Build and publish to PyPI
  # ---------------------------------------------------------------
  build-and-publish:
    needs: [check-commit, test]
    if: needs.check-commit.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Update version in pyproject.toml
        run: |
          VERSION="${{ needs.check-commit.outputs.version }}"
          echo "Setting version to: $VERSION"
          # replace the first  version = "x.y.z"  under [project]
          sed -i -E "0,/^version = \"[^\"]*\"/s//version = \"$VERSION\"/" pyproject.toml
          grep -m1 "version = " pyproject.toml

      - name: Ensure README.md exists (handles readme.md, Readme.md, etc.)
        run: |
          # CI runs on case-sensitive Linux. If pyproject.toml says README.md but
          # the committed file is readme.md / Readme.md, the long_description is
          # dropped. This guarantees a README.md exists with the right case.
          if [ ! -f "README.md" ]; then
            ALT=$(find . -maxdepth 1 -iname "readme.md" ! -name "README.md" | head -1)
            if [ -n "$ALT" ]; then
              cp "$ALT" README.md
              echo "Copied $ALT -> README.md (case/name mismatch fixed)"
            else
              echo "!! No README file found in repo root — long_description will be empty."
              ls -la
              exit 1
            fi
          else
            echo "OK: README.md present with correct case."
          fi

      - name: Clean old build artifacts
        run: rm -rf dist/ build/ src/*.egg-info/ *.egg-info/

      - name: Diagnose packaging config (why long_description could be missing)
        run: |
          echo "===== repo root ====="
          ls -la
          echo ""
          echo "===== README present? ====="
          ls -la README.md 2>/dev/null || echo "!! README.md NOT in repo root"
          echo ""
          echo "===== conflicting setup files? (these override pyproject.toml) ====="
          if [ -f setup.py ]; then
            echo "!! setup.py EXISTS — this overrides pyproject.toml and is likely why long_description is missing."
            echo "--- setup.py contents ---"; cat setup.py
          else
            echo "OK: no setup.py"
          fi
          if [ -f setup.cfg ]; then
            echo "!! setup.cfg EXISTS"; echo "--- setup.cfg ---"; cat setup.cfg
          else
            echo "OK: no setup.cfg"
          fi
          echo ""
          echo "===== does pyproject.toml declare the readme? ====="
          grep -n "readme" pyproject.toml || echo "!! no 'readme =' line in pyproject.toml"

      - name: Build package
        run: python -m build

      - name: Verify long_description is in the build BEFORE publishing
        run: |
          python - <<'PY'
          import glob, tarfile, sys
          sd = glob.glob('dist/*.tar.gz')[0]
          with tarfile.open(sd) as t:
              pkg = [m for m in t.getmembers() if m.name.endswith('PKG-INFO')][0]
              c = t.extractfile(pkg).read().decode()
          has_type = 'Description-Content-Type:' in c
          body = c.split('\n\n', 1)[1].strip() if '\n\n' in c else ''
          print("Description-Content-Type header:", has_type)
          print("Description body length:", len(body))
          if not has_type or len(body) < 50:
              print("\nERROR: the README did not get attached as long_description.")
              print("Most common cause: a setup.py in the repo overriding pyproject.toml.")
              sys.exit(1)
          print("OK: long_description is present.")
          PY

      - name: Verify README + version in built metadata
        run: |
          WHL=$(ls dist/*.whl)
          echo "Inspecting $WHL"
          python - <<'PY'
          import zipfile, glob
          whl = glob.glob('dist/*.whl')[0]
          with zipfile.ZipFile(whl) as z:
              meta = [f for f in z.namelist() if f.endswith('METADATA')][0]
              content = z.read(meta).decode()
              print(content[:800])
          PY

      - name: Check distribution renders on PyPI (hard gate)
        run: |
          # Fails the job if the long-description/README is missing or malformed,
          # so a bad build never reaches PyPI as "no description".
          python -m twine check --strict dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        # --skip-existing: if this exact version was already uploaded, don't hard-fail
        # (you should still bump the version each release via the commit message).
        run: python -m twine upload --non-interactive --skip-existing dist/*