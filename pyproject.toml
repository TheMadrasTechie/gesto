[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gesto"
version = "0.2.1"
description = "Train and run gesture recognition models from Gesto Labeller datasets"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sundar Balamurugan" }]
keywords = [
    "gesture-recognition",
    "mediapipe",
    "pose-estimation",
    "computer-vision",
    "lstm",
    "sign-language",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    # These are pinned to a mutually-compatible era. MediaPipe 0.10.x needs the
    # legacy solutions API (dropped in 0.10.31) plus protobuf 4.x and numpy 1.x;
    # newer TensorFlow (2.21+) wants protobuf 6.31+ and OpenCV 5.0 wants numpy 2.
    # Those conflict, so we hold TF, OpenCV and numpy at versions that agree
    # with MediaPipe 0.10.21. See README "Installation" if you need a newer TF.
    "numpy>=1.23,<2",
    "protobuf>=3.20,<5",
    "tensorflow>=2.15,<2.18",
    "opencv-python>=4.8,<4.12",
    "mediapipe>=0.10,<0.10.30",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://gestostudio.com"
Documentation = "https://gestostudio.com/docs.html"
Repository = "https://github.com/TheMadrasTechie/gesto"
Issues = "https://github.com/TheMadrasTechie/gesto/issues"

[project.scripts]
gesto = "gesto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]